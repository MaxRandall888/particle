<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle viewer</title>
  <link rel="stylesheet" href="{{ prefix }}/_static/css/mpl.css">
  <script src="{{ prefix }}/_static/js/mpl_tornado.js"></script>
  <script src="{{ prefix }}/js/mpl.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root { --viewer-background: #0b111a; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;
                 background: var(--viewer-background); color: #dce7f3; font: 13px system-ui, sans-serif; }
    header { height: 44px; display: flex; align-items: center; justify-content: space-between;
             padding: 0 18px; border-bottom: 1px solid #24364c; }
    header span { color: #7f93aa; }
    .viewer-controls { display: flex; align-items: center; gap: 14px; }
    #density-colormap { display: flex; align-items: center; gap: 8px; color: #7f93aa; }
    [hidden] { display: none !important; }
    #fullscreen, #colormap { background: #152131; color: #dce7f3; border: 1px solid #34465a;
                  border-radius: 5px; padding: 5px 12px; cursor: pointer; }
    #fullscreen:hover { background: #24364c; }
    #fullscreen:focus-visible { outline: 2px solid #65d9ed; outline-offset: 2px; }
    #figure { width: 100%; height: calc(100% - 44px); }
    .ui-dialog-titlebar { display: none; }
    .mpl-toolbar { height: 36px; padding: 2px 12px; background: var(--viewer-background); overflow: hidden; }
    .mpl-widget { padding: 3px 5px; background: #152131; color: #dce7f3; border-color: #34465a; }
    .mpl-widget img { filter: invert(85%); }
    .mpl-widget:hover { background: #24364c !important; }
  </style>
</head>
<body>
  <header>
    <span id="hint">Drag to orbit · Scroll to zoom · Home resets the camera</span>
    <div class="viewer-controls">
      <label id="density-colormap" hidden>Colormap
        <select id="colormap" aria-label="Density colormap">
          {% for name in colormaps %}
          <option value="{{ name }}">{{ name.title() }}</option>
          {% end %}
        </select>
      </label>
      <button id="fullscreen" type="button" title="Toggle fullscreen (F)">Fullscreen</button>
    </div>
  </header>
  <div id="figure"></div>
  <script>
    const container = document.getElementById("figure");
    const fullscreen = document.getElementById("fullscreen");
    const colormapControl = document.getElementById("density-colormap");
    const colormap = document.getElementById("colormap");
    mpl.figure.prototype.handle_density_state = function (_figure, message) {
      colormapControl.hidden = !message.enabled;
      colormap.value = message.colormap;
      document.documentElement.style.setProperty("--viewer-background", message.background);
    };
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${protocol}//${location.host}{{ prefix }}/{{ fig_id }}/ws`);
    const figure = new mpl.figure({{ fig_id }}, socket, mpl_ondownload, container);
    figure.root.style.display = "block";
    figure.canvas_div.style.border = "none";
    figure.canvas_div.style.resize = "none";
    colormap.addEventListener("change", () => {
      figure.send_message("density_colormap", {value: colormap.value});
      figure.canvas_div.focus();
    });

    // Ask Matplotlib to render at the viewport size; don't stretch the bitmap.
    let pendingResize;
    function fitViewport() {
      clearTimeout(pendingResize);
      pendingResize = setTimeout(() => {
        if (socket.readyState === WebSocket.OPEN) {
          const width = Math.max(320, Math.floor(container.clientWidth));
          const height = Math.max(300, Math.floor(container.clientHeight - 36));
          // WebAgg observes this element and resizes both canvases and Python.
          figure.canvas_div.style.width = `${width}px`;
          figure.canvas_div.style.height = `${height}px`;
        }
      }, 80);
    }
    socket.addEventListener("open", () => {
      fitViewport();
      figure.canvas_div.focus();
    });
    new ResizeObserver(fitViewport).observe(container);

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
        figure.canvas_div.focus();
      } catch (error) {
        document.getElementById("hint").textContent = "Fullscreen unavailable here. Try your browser's F11 shortcut.";
      }
    }
    fullscreen.addEventListener("click", toggleFullscreen);
    document.addEventListener("keydown", event => {
      if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
      if (event.key.toLowerCase() === "f" && !event.ctrlKey && !event.altKey && !event.metaKey) {
        event.preventDefault();
        event.stopImmediatePropagation();
        toggleFullscreen();
      }
    }, true);
    document.addEventListener("fullscreenchange", () => {
      fullscreen.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
      fitViewport();
    });
  </script>
</body>
</html>
